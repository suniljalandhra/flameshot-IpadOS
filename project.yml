# XcodeGen spec. Regenerate the project after changing it:
#   xcodegen generate
# Set your team and bundle IDs in `settings.base` below (or in Xcode).
name: Ember

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    APP_BUNDLE_ID: com.example.ember
    # Must be identical in the app and the broadcast extension.
    APP_GROUP_ID: group.com.example.ember
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  EmberKit:
    path: Packages/EmberKit

targets:
  Ember:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: EmberKit
      - target: EmberBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ember
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EmberAppGroup: $(APP_GROUP_ID)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Ember opens your latest screenshot so you can annotate it.
        NSPhotoLibraryAddUsageDescription: Ember saves annotated captures to your photo library.
    entitlements:
      path: App/Ember.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

  EmberBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
    dependencies:
      - package: EmberKit
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Broadcast
        SKIP_INSTALL: YES
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: Ember Screen Capture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EmberAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/EmberBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

schemes:
  Ember:
    build:
      targets:
        Ember: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: EmberKit/EmberKitTests
    archive:
      config: Release
